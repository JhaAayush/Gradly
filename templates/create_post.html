{% extends "base.html" %}
{% block title %}Create Post{% endblock %}
{% block content %}
<div class="max-w-3xl mx-auto py-10">
    <h1 class="text-3xl font-bold text-slate-800 mb-6">Create a Post</h1>
    <form method="POST" enctype="multipart/form-data" class="space-y-4">
        <input type="text" name="title" placeholder="Title" required
            class="w-full border rounded-lg p-2 focus:ring focus:ring-blue-300">

        <div id="editor" class="border rounded-lg p-2 bg-white"></div>
        <input type="hidden" name="content" id="content">

        <input type="file" name="image" accept="image/*" class="w-full border p-2 rounded-lg">

        <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg shadow hover:bg-blue-700">
            Post
        </button>
    </form>
</div>

<!-- QuillJS -->
<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
<script>
    var quill = new Quill('#editor', { theme: 'snow' });
    document.querySelector("form").onsubmit = function () {
        document.querySelector("#content").value = quill.root.innerHTML;
    };
</script>
{% endblock %}
