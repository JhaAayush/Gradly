{% extends "base.html" %}
{% block title %}Edit Post{% endblock %}
{% block content %}
<div class="max-w-3xl mx-auto py-6 sm:py-10 px-4">

    <form method="POST" enctype="multipart/form-data" class="space-y-6 bg-white shadow rounded-xl p-6 sm:p-8">
        <h1 class="text-3xl font-bold text-slate-800 mb-2">Edit Your Post</h1>

        <div>
            <label for="title" class="block text-sm font-medium text-gray-700 mb-1">Title</label>
            <input type="text" name="title" id="title" placeholder="Your post title..." required
                value="{{ post.title }}"
                class="w-full border border-gray-300 rounded-lg bg-gray-50 px-4 py-2 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
        </div>

        <div>
            <label for="editor" class="block text-sm font-medium text-gray-700 mb-1">Content</label>
            <div class="border border-gray-300 rounded-lg overflow-hidden bg-white">
                <div id="editor" style="min-height: 200px;"></div>
            </div>
            <input type="hidden" name="content" id="content" value="{{ post.content | safe }}">
        </div>

        <div>
            <label for="image" class="block text-sm font-medium text-gray-700 mb-1">Cover Image (Optional)</label>

            {% if post.image_url %}
            <div class="my-4">
                <p class="text-sm font-medium text-gray-600 mb-2">Current Image:</p>
                <img src="{{ url_for('static', filename=post.image_url) }}" class="rounded-lg max-w-xs object-cover">
            </div>
            <p class="text-sm text-gray-500 mb-2">Upload a new image to replace the current one:</p>
            {% endif %}

            <input type="file" name="image" id="image" accept="image/*"
                class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer">
        </div>

        <div class="pt-2">
            <button type="submit"
                class="inline-block px-6 py-3 bg-indigo-600 text-white rounded-lg shadow-lg hover:bg-indigo-700 font-medium transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                Update Post
            </button>
        </div>
    </form>
</div>

<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
<script>
    var quill = new Quill('#editor', {
        theme: 'snow',
        placeholder: 'Write your post content here...'
    });

    // --- MODIFICATION ---
    // Load the existing post content into Quill
    var existingContent = document.querySelector("#content").value;
    if (existingContent) {
        quill.root.innerHTML = existingContent;
    }
    // --- END MODIFICATION ---

    document.querySelector("form").onsubmit = function () {
        // Get HTML content from Quill
        var content = quill.root.innerHTML;
        // Check if editor is effectively empty (quill adds <p><br></p>)
        if (content === '<p><br></p>') {
            document.querySelector("#content").value = "";
        } else {
            document.querySelector("#content").value = content;
        }
    };
</script>
{% endblock %}
