{% extends "base.html" %}
{% block title %}Resources{% endblock %}
{% block content %}
<div class="max-w-6xl mx-auto py-12">
    <h1 class="text-4xl font-extrabold text-slate-800 text-center mb-12">Resources</h1>

    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
        {% for res in resources %}
        <div
            class="bg-white/70 backdrop-blur-lg rounded-2xl shadow-lg border border-slate-200 overflow-hidden hover:shadow-2xl transition-all duration-300">
            <div class="p-6">
                <h2 class="text-xl font-bold text-slate-800 mb-2">{{ res.title }}</h2>
                <p class="text-slate-600 mb-4">{{ res.description }}</p>
                <a href="{{ res.file }}"
                    class="inline-block bg-sky-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-sky-700 transition">View
                    / Download</a>
            </div>
        </div>
        {% else %}
        <p class="text-slate-500 text-center col-span-full">No resources available yet. Please check back later.</p>
        {% endfor %}
    </div>
</div>
{% endblock %}
